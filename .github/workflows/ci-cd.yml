name: WatchWise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. CODE QUALITY & SECURITY SCAN
  # ============================================================================
  security-and-lint:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Syntax & Error Check (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,__pycache__
          # Exit-zero treats warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,__pycache__

      - name: Verify No Secrets Committed
        run: |
          echo "Verifying no .env files or credentials are tracked in Git..."
          if git ls-files | grep -E "(^\.env|\.env\.)" | grep -v "\.env\.example"; then
            echo "::error::Found .env file checked into version control! Remove immediately."
            exit 1
          fi
          echo "Verified: No secret files are checked in."

  # ============================================================================
  # 2. AUTOMATED UNIT & ENGINE TESTS
  # ============================================================================
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: security-and-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

  # ============================================================================
  # 3. SMOKE TEST & STREAMLIT DEPLOYMENT VERIFICATION (CD)
  # ============================================================================
  deploy-check:
    name: Streamlit App Smoke Test
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Streamlit App Headless Smoke Test
        run: |
          # Verify the model artifacts load and recommend function executes without errors
          python -c "
          import app
          movies, vectors, missing = app.load_artifacts()
          assert not missing, f'Missing artifacts: {missing}'
          res = app.recommend('Batman Begins', movies, vectors, None, k=5)
          assert len(res['results']) == 5, 'Recommender failed to generate 5 results'
          print('Deployment smoke test passed successfully!')
          "
